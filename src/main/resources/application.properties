# Change the HTTP port to 8888
quarkus.http.port=8081

# configure your datasource
quarkus.datasource.db-kind = mysql
quarkus.datasource.username = root
quarkus.datasource.password = 007David
quarkus.datasource.jdbc.url = jdbc:mysql://localhost:3306/todogrupo1

# drop and create the database at startup (use `update` to only update the schema)
quarkus.hibernate-orm.schema-management.strategy = drop-and-create
quarkus.hibernate-orm.sql-load-script = import.sql

# Logging SQL ? clave para la demo de N+1 vs join fetch
quarkus.hibernate-orm.log.sql = true
quarkus.hibernate-orm.log.format-sql = true
quarkus.hibernate-orm.log.bind-parameters = false

# CORS ? para que la guia HTML pueda llamar al API desde file://
quarkus.http.cors = true
quarkus.http.cors.origins = /.*/
quarkus.http.cors.methods = GET,POST,PUT,DELETE,OPTIONS

quarkus.google.cloud.service-account-location=todo-list-58e01-firebase-adminsdk-fbsvc-28c3b069a4.json

# Firebase Authentication REST Client
# (now handled directly in UserRepositoryImpl)

# ===== Kafka =====
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.kafka-out.connector=smallrye-kafka
mp.messaging.outgoing.kafka-out.topic=kafka.topic
mp.messaging.outgoing.kafka-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.incoming.kafka-in.connector=smallrye-kafka
mp.messaging.incoming.kafka-in.topic=kafka.topic
mp.messaging.incoming.kafka-in.group.id=hello-world
mp.messaging.incoming.kafka-in.auto.offset.reset=earliest
mp.messaging.incoming.kafka-in.value.deserializer=com.itesm.infrastructure.messaging.kafka.KafkaMessageDeserializer

# ===== RabbitMQ =====
quarkus.rabbitmq.devservices.enabled=false

rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Producer -> fanout exchange
mp.messaging.outgoing.rabbit-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.rabbit-out.exchange.name=rabbit.exchange
mp.messaging.outgoing.rabbit-out.exchange.type=fanout
mp.messaging.outgoing.rabbit-out.exchange.declare=true

# Consumer One
mp.messaging.incoming.rabbit-one-in.connector=smallrye-rabbitmq
mp.messaging.incoming.rabbit-one-in.queue.name=rabbit.queue.one
mp.messaging.incoming.rabbit-one-in.queue.declare=true
mp.messaging.incoming.rabbit-one-in.exchange.name=rabbit.exchange
mp.messaging.incoming.rabbit-one-in.exchange.type=fanout
mp.messaging.incoming.rabbit-one-in.exchange.declare=true

# Consumer Two
mp.messaging.incoming.rabbit-two-in.connector=smallrye-rabbitmq
mp.messaging.incoming.rabbit-two-in.queue.name=rabbit.queue.two
mp.messaging.incoming.rabbit-two-in.queue.declare=true
mp.messaging.incoming.rabbit-two-in.exchange.name=rabbit.exchange
mp.messaging.incoming.rabbit-two-in.exchange.type=fanout
mp.messaging.incoming.rabbit-two-in.exchange.declare=true

# Test profile: H2 in-memory database
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=no-file
%test.firebase.service-account-location=none

# Test profile: in-memory messaging so tests don't need a broker
%test.mp.messaging.outgoing.rabbit-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.rabbit-one-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.rabbit-two-in.connector=smallrye-in-memory
%test.mp.messaging.outgoing.kafka-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.kafka-in.connector=smallrye-in-memory

